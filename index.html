<style>
:root{--bg:#fff;--ink:#111;--mut:#5d5d5d;--line:#e3e3e3;--acc:#ffd60a;--on-acc:#111;--soft:#f4f4f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

:root[data-theme="dark"]{--bg:#050505;--ink:#f5f5f5;--mut:#a3a3a3;--line:#2a2a2a;--soft:#161616;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:17px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:18px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:-.02em;background:var(--acc);color:var(--on-acc);padding:2px 10px;border-radius:6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#lang{margin-right:6px}#theme,#lang{background:none;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
h1{font-weight:900;font-size:clamp(38px,11vw,56px);line-height:.98;letter-spacing:-.035em;margin:34px 0 10px}
.sub{color:var(--mut);margin:0 0 20px}
#q{width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:500;padding:14px 16px}
.tabs{display:flex;gap:8px;margin:16px 0 6px}
.tab{border:1.5px solid var(--line);background:none;border-radius:99px;padding:8px 16px;font-weight:700}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:18px 2px;border-radius:0}
.row b{display:block;font-size:20px;font-weight:900;letter-spacing:-.01em}
.row span{color:var(--mut);font-size:15px}
.row:hover b{text-decoration:underline;text-decoration-color:var(--acc);text-decoration-thickness:4px;text-underline-offset:3px}
.empty{color:var(--mut);padding:24px 2px}
.back{background:none;border:0;font-weight:700;padding:4px 0;margin:22px 0 6px}
.tag{display:inline-block;background:var(--soft);border-radius:6px;padding:2px 10px;font-weight:700;font-size:14px}
h2{font-weight:900;font-size:clamp(30px,9vw,42px);line-height:1;letter-spacing:-.03em;margin:12px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--ink);background:none;border-radius:99px;padding:6px 14px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.mnote{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:16px}
.warn{background:var(--acc);color:var(--on-acc);border-radius:10px;padding:14px 16px;font-weight:700;margin:16px 0}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:900;font-size:14px}
.steps li.done::before{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.steps li.done .t b{color:var(--mut);text-decoration:line-through}.ic{flex:none;width:64px;height:64px}.t b{display:block;font-weight:700}.t em{display:block;font-style:normal;color:var(--mut);font-size:15px;margin-top:4px}.ic svg{width:100%;height:100%;display:block}.t{flex:1}#sel{width:100%;font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px 14px;margin:8px 0 12px}
.steps li{cursor:pointer}
.prog{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
.pt{font-size:14px;color:var(--mut)}
.pro{margin-top:22px;border:2px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:15px}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
#dxgo{background:var(--acc);color:var(--on-acc);border:3px solid #111}#dxgo span{color:var(--on-acc)}.dxhero{background:var(--acc);color:var(--on-acc);border:3px solid #111;border-radius:14px;padding:16px;margin:12px 0}.dxhero h1{margin:0 0 6px;color:var(--on-acc)}.dxhero .sub{margin:0;color:var(--on-acc)}.dx details{border-bottom:1px solid var(--line);padding:2px 0}.dx summary{font-weight:700;padding:12px 0;cursor:pointer}.dx summary .tag{display:block;width:max-content;margin-top:6px;font-size:13px}.dx .lv2{background:var(--acc);color:var(--on-acc)}.dx p{margin:0 0 10px;font-size:16px}.dx h2{font-size:21px;margin:22px 0 4px}.dx .chip{margin:0 0 12px}#dq{width:100%;font:inherit;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);padding:12px 14px}.need{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin:0 0 16px}.need b{display:block;margin-bottom:6px}.need ul{margin:0 0 8px;padding-left:20px}.need p{margin:0 0 8px}.need .meta{color:var(--mut);font-size:15px}u.gl{text-decoration:underline dotted;text-underline-offset:3px;cursor:help}#glp{position:fixed;left:12px;right:12px;bottom:12px;background:var(--acc);color:var(--on-acc);border:3px solid #111;border-radius:14px;padding:14px;z-index:9;font-size:16px}#emgo{background:var(--ink);color:var(--bg);border:3px solid var(--ink)}#emgo span{color:var(--bg)}.emo{margin:0 0 12px;padding-left:22px}.emo li{margin-bottom:8px;font-size:17px}.steps li{flex-wrap:wrap}.steps .ic{order:3;flex:0 0 100%;width:100%;height:auto;max-width:360px;margin-top:6px}.steps .ic svg{height:auto}#favs .row b{font-size:18px}#fv{margin:6px 0 0}
.need li{cursor:pointer;list-style:none;margin-left:-18px}.need li::before{content:"☐ "}.need li.ck{text-decoration:line-through;color:var(--mut)}.need li.ck::before{content:"☑ "}#fz{margin-right:6px;background:none;border:1.5px solid var(--line);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}#pf select{width:100%;font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px 12px;margin:0 0 12px}
#setw{position:relative}#gear{background:none;border:1.5px solid var(--line);border-radius:99px;width:40px;height:40px;font-size:20px;line-height:1;padding:0}#setp{position:absolute;right:0;top:48px;z-index:20;background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:150px}#setp[hidden]{display:none}#setp button{margin:0!important;text-align:center}#fz{font-size:18px!important}
.rk{display:inline-block;border:2px solid var(--ink);border-radius:6px;padding:2px 10px;font-weight:800;font-size:14px;margin-left:6px}.fbb{border:2px solid var(--ink);border-radius:99px;background:var(--bg);color:var(--ink);padding:8px 18px;font:inherit;font-weight:700}.steps li.lk{opacity:.4}.sfb{display:block;font-weight:800;font-size:14px;margin-top:4px;color:var(--ink)}
</style>

<main>
<header><span class="logo">PaTodo!</span><span id="setw"><button id="gear" type="button" aria-label="Ajustes" aria-expanded="false">⚙</button><div id="setp" hidden><button id="fz" type="button" aria-label="Tamaño de letra">Aa</button><button id="lang" type="button">English</button><button id="theme" type="button">Modo negro</button></div></span></header>
<section id="home">
<h1>¿Qué se descompuso hoy?</h1>
<p class="sub">Aprende a arreglarlo tú, paso a paso y sin regaños. Para tu casa y tu carro, con tu modelo.</p>

</section>

var CD={power:"Antes de seguir, comprueba que quedó apagado de verdad: sin luz encendida ni ruido. Si puedes, desconéctalo también de la pared.",plug:"Jala siempre de la clavija o del conector, nunca del cable. Hazlo con las manos secas y sin prisa.",bolt:"Aquí hay electricidad. Si tienes duda, para y pregunta a alguien que sepa. Nunca toques metal que pueda tener corriente.",eye:"Tómate tu tiempo para mirar. Si puedes, toma una foto con el celular para comparar o para acordarte después.",wrench:"Hazlo con calma y sin forzar. Si una pieza no sale fácil, no la jales: revisa si falta soltar un seguro o un tornillo.",drops:"Usa agua tibia o caliente según diga el paso y ten un trapo a la mano para secar lo que se moje.",brush:"Limpia con movimientos suaves. Un cepillo viejo o un trapo húmedo sirven; no uses nada que raye.",up:"Hazlo despacio y con las dos manos. Si algo ofrece resistencia, busca el seguro en vez de jalar más fuerte.",down:"Bájalo con control para que no caiga de golpe. Cuida tus dedos.",check:"Prueba antes de recoger tus herramientas. Si no funciona, regresa al paso anterior antes de seguir.",clock:"No te apresures: esperar es parte del trabajo. Mientras tanto, junta tus herramientas.",phone:"Llamar a un profesional no es fracasar: aquí es lo correcto. Pide el precio antes y anota el nombre de quien te atienda.",warn:"Esto es lo que más se hace mal. Léelo dos veces antes de seguir.",note:"Anótalo en el celular o en un papel. Te va a servir cuando tengas que volver a armarlo.",gauge:"Lee con calma y compara con lo que dice el manual o la etiqueta de tu equipo.",flame:"Con gas, la seguridad va primero: nada de flamas ni chispas cerca y ventila el lugar.",tire:"Trabaja en piso plano y firme, con el carro frenado. Cuida tus manos y tus pies."};
var D={
clima:["Primero oprime el botón de apagar y espera a que el aspa se detenga. Luego baja la pastilla del clima o saca el enchufe con la mano seca.","Sujétala de las orillas inferiores y levántala despacio, como la tapa de un cofre. Se queda arriba sola; si no, sostenla con una mano.","Son mallas de plástico que se deslizan hacia abajo o hacia ti. Jala de la pestaña sin doblarlas y fíjate de qué lado va cada una.","Ponlos bajo el chorro por el lado sucio, tallando suave con una esponja. Saldrá polvo gris; repite hasta que el agua salga limpia.","Apóyalos en un lugar con aire, de 30 a 60 minutos. Si los pones húmedos, el clima huele a humedad.","Mete cada filtro por su ranura hasta el fondo. Cierra la tapa y presiona las esquinas hasta oír clic. Enciende en modo frío para probar."],
llanta:["Busca un lugar plano y lejos del tráfico. Ejemplo: un acotamiento ancho o una calle tranquila, nunca una curva ni una subida.","Suelen ir bajo el piso de la cajuela. Levanta el tapete, gira el tornillo central y saca la refacción, el gato y la llave en forma de cruz.","Con la llanta aún en el piso, pon la llave en una tuerca y empuja hacia abajo con tu peso. Gira a la izquierda solo media vuelta en cada una.","Busca en el manual el punto de apoyo, casi siempre una ranura en el borde inferior, junto a la llanta. Sube con la manivela hasta que la llanta quede a unos 5 cm del piso.","Guarda las tuercas en tu bolsillo, no en el piso. Alinea los birlos con los hoyos de la refacción y empújala hasta el fondo.","Enrosca las tuercas con la mano. Baja el gato y aprieta con la llave en forma de estrella: una, la de enfrente, otra, la de enfrente.","Una refacción guardada pierde aire. Pasa a una gasolinera y revisa que tenga la presión que marca la etiqueta de la puerta."],
corriente:["Pon los carros frente a frente sin que se toquen, con el freno de mano puesto. Los cables deben llegar cómodos a las dos baterías.","El positivo lleva el signo + y tapa roja. Abre la tapa y haz que la pinza roja muerda el metal; jálala suave para confirmar que no se suelta.","Es el mismo borne, pero del carro que sí funciona. Cuida que las dos pinzas rojas no se toquen entre sí ni toquen metal.","El negativo lleva el signo − y casi siempre tapa negra. Conecta ahí la pinza negra sin soltar las demás.","Busca un tornillo o soporte de metal limpio, lejos de la batería. Así evitas chispas junto a ella. Ejemplo: un perno del motor.","Déjalo funcionando de 3 a 5 minutos. Así pasa carga a la batería débil.","Si prendió, quita las pinzas en orden contrario: primero la negra del metal, luego la negra de la batería buena y al final las rojas. Deja tu carro andando unos 20 minutos."]};

{id:'regadera',c:'casa',k:'Plomería',t:'La regadera sale con poca agua',d:'Los hoyitos se tapan con sarro',mt:'Tipo de regadera',m:{'Fija en la pared':'Se desenrosca del tubo girándola a la izquierda.','De mano':'Se desenrosca de la manguera, es más fácil de limpiar.','Con brazo largo':'Sujeta el brazo con una mano para no forzar la tubería.'},w:'Cierra el agua caliente antes de tocarla para no quemarte.',s:['Cierra las llaves de agua y espera a que no gotee.','Desenrosca la regadera girándola a la izquierda.','Revisa los hoyitos: si hay polvo blanco, es sarro.','Remójala una hora en una cubeta con vinagre y agua.','Talla los hoyitos con un cepillo de dientes viejo.','Enjuágala con agua limpia y mira que pase por todos los hoyos.','Pon cinta de teflón en la rosca, enrosca la regadera y abre el agua.'],p:'Si sigue saliendo poca agua, puede estar tapada la tubería: llama a un plomero.'},
{id:'cambioaceite',c:'auto',k:'Motor',t:'Cambiar el aceite del motor',d:'Aceite y filtro nuevos, paso a paso',mt:'Tu carro',m:mm(CAR,function(n){return 'En '+n+': el manual dice qué aceite lleva, cuántos litros y qué filtro necesita.'},'tu carro'),w:'Hazlo con el motor tibio, no caliente. Nunca te metas debajo de un carro que solo esté sobre el gato: usa rampas o burros firmes.',s:['Junta aceite y filtro del tipo que marca el manual, llave, charola, embudo y guantes.','Calienta el motor 2 minutos, apágalo y sube el carro en rampas o burros firmes.','Pon la charola bajo el tapón del cárter y afójalo con la llave.','Quita el tapón con la mano y deja salir todo el aceite viejo.','Cambia la rondana, pon el tapón y apriétalo firme sin pasarte.','Afloja el filtro viejo con la llave de filtros y deja que escurra.','Unta aceite en el hule del filtro nuevo y enróscalo solo con la mano.','Baja el carro, abre la tapa del aceite y vierte el aceite nuevo con el embudo.','Revisa con la varilla que el nivel quede entre las dos marcas.','Arranca, espera 1 minuto y mira que no gotee nada abajo.'],p:'Lleva el aceite usado en un envase cerrado a un taller o centro de acopio; no lo tires al drenaje.'},
{id:'sobrecal',c:'auto',k:'Motor',t:'El motor se sobrecalienta',d:'La aguja de temperatura sube a rojo',mt:'Tu carro',m:mm(CAR,function(n){return 'En '+n+': la luz de temperatura es un termómetro con ondas; si se enciende, para.'},'tu carro'),w:'Nunca abras el tapón del radiador ni del depósito con el motor caliente: sale vapor y quema.',s:['Cuando veas la aguja en rojo, oríllate y apaga el motor.','Pon las intermitentes y abre el cofre solo con la palanca interior, sin tocar el motor.','Espera al menos 30 minutos a que enfríe.','Mira si hay vapor, manchas de líquido debajo o mangueras rotas.','Con el motor frío, revisa el nivel del depósito de anticongelante.','Si falta, rellénalo con la mezcla que marca tu manual; en una emergencia, agua limpia.','Arranca y mira que la aguja se mantenga en el centro.','Si vuelve a subir, apágalo y llama a la grúa.'],p:'Si hay fuga, el depósito se vacía rápido o se vuelve a calentar, no sigas manejando: llama a la grúa.'},
{id:'cambiobat',c:'auto',k:'Eléctrico',t:'Cambiar la batería del carro',d:'Cuando ya no arranca ni con corriente',mt:'Tu carro',m:mm(CAR,function(n){return 'En '+n+': la batería suele ir bajo el cofre, a un lado; el manual dice qué medida lleva.'},'tu carro'),w:'Usa guantes y lentes. Quita siempre primero el cable negativo (−) y conéctalo al final.',s:['Apaga el carro, quita la llave y abre el cofre.','Toma una foto de cómo están conectados los cables.','Afloja y quita primero el cable negativo (−).','Afloja y quita después el cable positivo (+).','Quita la abrazadera que sujeta la batería.','Saca la batería vieja con las dos manos, derecha y sin inclinarla.','Pon la nueva en el mismo lugar y sujeta con la abrazadera.','Conecta primero el positivo (+) y al final el negativo (−).','Aprieta firme los bornes y arranca el carro.'],p:'La batería vieja se entrega en la tienda donde compras la nueva; no la tires a la basura.'},
{id:'parpadea',c:'casa',k:'Electricidad',t:'El foco parpadea o se funde seguido',d:'Casi siempre es el foco, el socket o un cable flojo',mt:'Tipo de foco',m:{'LED':'Algunos LED parpadean si el apagador tiene luz piloto o no es compatible.','Ahorrador':'Es normal que tarde en prender y que dure menos si se prende y apaga mucho.','Incandescente':'Se funde antes; revisa que no sea de más watts de lo que soporta la lámpara.'},w:'Apaga el apagador, baja la pastilla de ese circuito y deja enfriar el foco antes de tocarlo.',s:['Apaga el apagador, baja la pastilla y deja enfriar el foco unos minutos.','Desenrosca el foco girándolo a la izquierda.','Revisa que el foco no esté negro ni suelto en la base.','Prueba con otro foco que sepas que sirve.','Mira el socket: si la lengüeta del centro está aplastada, levántala suave con un palito de madera.','Revisa que los watts del foco no pasen de lo que marca la lámpara.','Enrosca el foco firme, sin pasarte, sube la pastilla y prende.'],p:'Si parpadean varios focos de la casa o huele a quemado, puede ser el cableado: llama a un electricista.'},
{id:'empana',c:'auto',k:'Visibilidad',t:'El parabrisas se empaña',d:'Para ver bien con frío o lluvia',mt:'Tu carro',m:mm(CAR,function(n){return 'En '+n+': busca en el tablero el botón con el dibujo del parabrisas y flechas curvas.'},'tu carro'),w:'Si no ves bien, oríllate y para: manejar sin visibilidad es muy peligroso.',s:['Enciende el desempañador: el botón con el dibujo del parabrisas y flechas.','Sube el ventilador y dirige el aire hacia el parabrisas.','Pon la temperatura en caliente al inicio para secar rápido.','Prende el aire acondicionado (A/C): quita la humedad del aire.','Apaga el recirculado y deja entrar aire de afuera.','Baja un poco las ventanas para que salga la humedad.','Limpia por dentro con un trapo de microfibra seco y limpio.'],p:'Si el vidrio se empaña muy seguido o el piso del carro está mojado, puede haber una fuga de agua: revísalo en un taller.'}

var CEn={power:'Before you continue, make sure it is really off: no lights on and no noise. If you can, also unplug it from the wall.',plug:'Always pull the plug or the connector, never the cable. Do it with dry hands and without rushing.',bolt:'There is electricity here. If you have any doubt, stop and ask someone who knows. Never touch metal that may be live.',eye:'Take your time to look. If you can, take a photo with your phone to compare or to remember later.',wrench:'Do it calmly and without forcing. If a part does not come out easily, do not yank it: check whether a latch or screw is still holding it.',drops:'Use warm or hot water as the step says, and keep a cloth handy to dry whatever gets wet.',brush:'Clean with gentle movements. An old brush or a damp cloth works; do not use anything that scratches.',up:'Do it slowly and with both hands. If something resists, look for the latch instead of pulling harder.',down:'Lower it under control so it does not drop. Watch your fingers.',check:'Test before you put your tools away. If it does not work, go back to the previous step before continuing.',clock:'Do not rush: waiting is part of the job. Meanwhile, gather your tools.',phone:'Calling a professional is not failing: here it is the right thing to do. Ask the price first and write down the name of who helps you.',warn:'This is what most people get wrong. Read it twice before continuing.',note:'Write it down on your phone or on paper. It will help when you have to put it back together.',gauge:'Read it calmly and compare it with what the manual or your equipment label says.',flame:'With gas, safety comes first: no flames or sparks nearby, and ventilate the place.',tire:'Work on flat, firm ground with the car braked. Watch your hands and feet.',breaker:'The main breaker is in the breaker box, usually near the entrance. Switch off only the circuit you will touch and tell the people at home.',bulb:'With the bulb or lamp off and cool. Hold the bulb by the glass with a dry cloth, not by the metal part.',valve:'The shut-off valve closes by turning clockwise until it stops. If it is stuck, do not force it with pliers: ask for help.',screw:'Use the screwdriver or wrench that fits the head exactly so it does not strip. Loosen counterclockwise, tighten clockwise.',faucet:'Put a bucket or a cloth underneath in case water spills. Close the main shut-off valve first if you will open a pipe.',battery:'The battery has a positive (+) and a negative (-) terminal. Wear gloves and glasses, and do not rest tools on top.',filter:'Look at it against the light: if light does not pass through, it is dirty. Before removing it, note how it is installed.',bucket:'Keep a bucket or container and cloths handy. Hoses can spill water when you disconnect them.',remote:'Press the buttons one at a time and wait for the equipment to respond before pressing again.',ac:'With the AC off and the fan stopped. Use a sturdy ladder if you cannot reach, never a chair.',jack:'Place the jack at the point shown in the manual, on firm ground. Never go under a car that is only held by the jack.',stove:'With the stove cold and off. If you smell gas, close the valve, ventilate and do not light anything.',hood:'With the engine off and cool. If you need the hood open, secure it with its prop rod.'};
var DEn={clima:['First press the off button and wait for the fan blade to stop. Then switch off the AC breaker or unplug it with a dry hand.','Hold it by the lower edges and lift slowly, like a car hood. It stays up on its own; if not, hold it with one hand.','They are plastic meshes that slide down or toward you. Pull the tab without bending them and note which side each one goes.','Hold them under the tap on the dirty side, rubbing gently with a sponge. Gray dust will come out; repeat until the water runs clear.','Lean them in a place with airflow for 30 to 60 minutes. If you put them back damp, the AC smells musty.','Slide each filter into its slot all the way. Close the cover and press the corners until you hear a click. Turn it on in cool mode to test.'],
llanta:['Find a flat place away from traffic. Example: a wide shoulder or a quiet street, never a curve or a hill.','They are usually under the trunk floor. Lift the mat, turn the center bolt and take out the spare, the jack and the cross wrench.','With the tire still on the ground, put the wrench on a nut and push down with your weight. Turn counterclockwise only half a turn on each.','Look in the manual for the support point, usually a slot on the lower edge next to the tire. Crank until the tire is about 5 cm off the ground.','Keep the nuts in your pocket, not on the ground. Line up the bolts with the holes of the spare and push it all the way in.','Thread the nuts by hand. Lower the jack and tighten with the wrench in a star pattern: one, the one across, another, the one across.','A stored spare loses air. Stop at a gas station and check that it has the pressure on the label of the driver door.'],
corriente:['Park the cars facing each other without touching, with the parking brake on. The cables must reach both batteries comfortably.','The positive has a + sign and a red cover. Open the cover and make the red clamp bite the metal; tug gently to confirm it does not come off.','Same terminal, but on the car that works. Make sure the two red clamps do not touch each other or any metal.','The negative has a - sign and usually a black cover. Connect the black clamp there without letting go of the others.','Look for a clean bolt or metal bracket away from the battery. This avoids sparks next to it. Example: an engine bolt.','Leave it running for 3 to 5 minutes. This passes charge to the weak battery.','If it started, remove the clamps in reverse order: first the black from the metal, then the black from the good battery, and last the red ones. Keep your car running about 20 minutes.']};
var GE={clima:{t:'Clean the AC filter',d:'Mini split: it cools better and uses less electricity',mt:'Your AC brand',m:mE(CL,{Mirage:'Many Mirage units open the front cover from the bottom, with both hands and without pulling hard.',LG:'On several LG models the filters slide out downward, one from each side.',Carrier:'Check whether the filter has a tab in the middle; that is where you pull to remove it.',Samsung:'Some models have the filter behind a grille that lifts up before you take it out.',Otro:'Look for the model label on the side of the unit and check its manual.'},function(n){return 'On '+n+': the manual shows how to open the cover; it usually lifts from the edges.'},'your unit'),w:'Turn the AC off and unplug it or switch off its breaker before opening.',s:['Turn the AC off with the remote and switch off the breaker or unplug it.','Lift the front cover until it stays in place.','Take out the filters carefully, without forcing them.','Wash them with warm water and mild soap. Do not use hot water.','Let them dry in the shade, never in direct sun or in a dryer.','Put them back, lower the cover until you hear a click, and turn it on.'],p:'If the AC drips or smells odd even with clean filters, have a technician check it.'},
llanta:{t:'Change a flat tire',d:'With the spare and the jack of your car',mt:'Your car',m:mE(CAR,null,function(n){return 'On '+n+': check the manual for where the jack and the spare go.'},'your car'),w:'Do it on flat, firm ground with the parking brake on. Never go under a raised car.',s:['Pull over, turn on the hazard lights and the parking brake.','Take out the spare, the jack and the cross wrench.','Loosen the nuts half a turn, without removing them, with the tire on the ground.','Raise the car with the jack at the point marked in the manual.','Remove the nuts and the tire; put on the spare.','Tighten by hand, lower the car and tighten in a star pattern.','Check the spare tire pressure as soon as you can.'],p:'Small spares are temporary: do not go over 80 km/h.'},
corriente:{t:'Jump-start a car',d:'When the battery will not start the car',mt:'Your car',m:mE(CAR,null,function(n){return 'On '+n+': find the positive (+) under its red cover and an unpainted metal spot for the negative.'},'your car'),w:'Check that the battery is not swollen or leaking. If it is, do not jump-start it.',s:['Bring the other car close, turn both off and take out the keys.','Red clamp to the positive (+) of the dead battery.','Other red end to the positive (+) of the good battery.','Black clamp to the negative (-) of the good battery.','Last black end to unpainted metal on the car that will not start.','Start the good car and wait a few minutes.','Start yours and remove the clamps in reverse order.'],p:'If it does not start after several tries, it may be the battery or the alternator; have it checked at a shop.'},
gas:{t:'Check for a gas leak',d:'Tank, hose and regulator',mt:'Type of gas',m:{'Stationary tank':'Check the regulator and the connections coming out of the tank.','Portable cylinder':'Check the joint between the cylinder, the regulator and the hose.','Natural gas':'With natural gas, ventilate and call the gas company; do not look for the leak yourself.'},w:'If it smells strongly of gas: do not turn on lights, do not use your phone inside, open windows and leave. Call emergency services or your provider.',s:['Close the gas shut-off valve.','Open doors and windows to ventilate.','Mix water with soap and apply it with a sponge on the connections.','If bubbles appear, there is a leak: do not tighten it or patch it yourself.','Never use a match or lighter to look for the leak.','Call your provider to replace the part.'],p:'Replacing hoses, regulators or the tank must be done by your provider.'}};
var DXE={0:{t:'My AC is not cooling',k:'ac air conditioner conditioning cooling cool cold mini split',c:[['The filters are dirty','The air comes out weak or there is gray dust on the mesh.','Wash them with warm water and soap, let them dry and put them back.'],['The remote is in another mode','Check that it says cool mode (snowflake), not fan or dry.','Set it to cool mode, 24 degrees, and the fan on auto.'],['Doors or windows are open, or the room is too big','Hot air gets into the room, or the room is much bigger than the AC.','Close doors, windows and curtains. If the room is very big, the unit may be too small.'],['The outdoor unit is dirty or blocked','The air from the outdoor unit is weak, or the grille has leaves and dust.','Turn it off and unplug it, remove the leaves and clean the grille with a soft brush. Do not use pressurized water.'],['Ice formed on the unit','There is ice on the pipe or inside the unit.','Turn it off, run only the fan for an hour so it melts, and clean the filters. If the ice comes back, call a technician.'],['It is low on refrigerant or the compressor is failing','It turns on and blows, but the air is warm even with clean filters.','This cannot be fixed at home: call an AC technician.']]},
1:{t:'My fridge is not cooling',k:'fridge refrigerator freezer cooling cold ice',c:[['The temperature dial is set low','Check the dial inside the fridge.','Set it to the middle level in the manual and wait 24 hours.'],['The door does not close well','Slide a sheet of paper between the door and the seal: if it comes out easily, it does not seal.','Clean the seal with warm water. If it is torn or hard, it must be replaced.'],['It is too full or has hot food','Food blocks the air vents.','Leave space between items and let food cool before storing it.'],['The condenser is dirty','There is dust on the grille at the back or bottom and the motor works hard.','Unplug it and carefully vacuum the dust.'],['There is a lot of ice on the walls','A thick layer of ice in the freezer.','Unplug it, let it defrost for about 4 hours with towels underneath and plug it back in.'],['The compressor or the thermostat is failing','Everything above is fine and the motor does not start or does not stop.','Call an appliance technician.']]},
3:{t:'My car will not start',k:'car start starting engine battery wont',c:[['The battery is dead','You hear a weak click when turning the key, or the lights are very dim.','Jump-start it with another car.'],['The battery terminals are dirty','There is white or green powder on the terminals.','Clean them with a brush and water with baking soda.'],['It is out of gas','The dashboard shows empty.','Fill up and wait a few seconds before starting.'],['The gear lever is not in P or N','Some automatics will not start unless parked.','Put the lever in P or N and press the brake.'],['A fuse blew','Nothing makes a sound and there are no dashboard lights.','Find the fuse box and replace the one labeled start or ignition.'],['The starter or the alternator is failing','The battery is good and the engine still does not turn.','Call a mechanic or a tow truck.']]},
5:{t:'My stove will not light or heat',k:'stove burner oven gas light lighting heat heating flame',c:[['It smells like gas','Strong gas smell in the kitchen.','Do not light anything or use switches: close the valve, open windows, leave and call your gas provider.'],['The gas valve is closed or the tank is empty','You do not hear gas coming out when you open the knob.','Open the shut-off valve and check the tank.'],['The burner is clogged with grease','The flame is crooked or yellow in some holes.','With the stove cold, clean it with a brush and soapy water, and dry it very well.'],['The igniter is dirty or wet','You hear the tick but it does not light.','Dry it and clean it with a dry brush.'],['The knob is loose or worn','The knob turns but no gas comes out.','Replace it with an identical one.']]},
6:{t:'I have no light at a bulb or outlet',k:'light bulb outlet socket switch lamp power blackout',c:[['The bulb is burned out','Try another bulb that you know works.','Replace it.'],['The breaker tripped','Several places have no power at once.','Switch it back on. If it trips again by itself, there is a problem: call an electrician.'],['The light switch is damaged','The bulb works, but the switch crackles or does not click.','Replace it with the breaker off.'],['The outlet has a loose wire','Only that outlet has no power.','Switch off the breaker and check the outlet screws.'],['The wiring is damaged','It smells burnt or there are sparks.','Do not touch it: switch off the breaker and call an electrician.']]}};

var cat="todo",cur=null,mod={},done={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function list(){
 var q=norm($("q").value),h="";
 G.forEach(function(g0){var g=tr(g0);
  if(cat!=="todo"&&g.c!==cat)return;
  if(q&&norm(g.t+" "+g.d+" "+Object.keys(g.m).join(" ")+" "+(g.k||"")).indexOf(q)<0)return;
  h+='<button class="row" type="button" data-id="'+g.id+'"><b>'+esc(g.t)+'</b><span>'+esc(g.d)+'</span></button>';
 });
 $("list").innerHTML=h||'<p class="empty">'+T('No encontré esa guía todavía. Prueba con otra palabra.')+'</p>';
}
function open(id){
 cur=G.filter(function(g){return g.id===id})[0];
 if(!mod[id])mod[id]=Object.keys(tr(cur).m)[0];
 if(!done[id])done[id]=[];
 $("home").hidden=true;$("guide").hidden=false;window.scrollTo(0,0);
 try{location.hash=id}catch(e){}
 draw();
}
function draw(){
 var g=tr(cur),h='<button class="back" type="button" id="bk">'+T('← Todas las guías')+'</button>'+(L==='en'&&!GE[cur.id]?'<p class="pt">'+T('Esta guía todavía no está traducida.')+'</p>':'');
 h+='<div style="width:130px;color:var(--ink)">'+art(g)+'</div><span class="tag">'+T(g.c==="casa"?"Casa":"Carro")+(g.k?" · "+T(g.k):"")+'</span><h2>'+esc(g.t)+'</h2>';
 var ks=Object.keys(g.m),big=ks.length>8;h+='<div class="pt">'+esc(g.mt)+'</div>'+(big?'<select id="sel">'+ks.map(function(k){return '<option'+(mod[g.id]===k?' selected':'')+'>'+esc(k)+'</option>'}).join('')+'</select><div>':'<div class="chips">');
 (big?[]:ks).forEach(function(k){h+='<button class="chip" type="button" data-m="'+esc(k)+'" aria-pressed="'+(mod[g.id]===k)+'">'+esc(k)+'</button>'});
 h+='</div><div class="mnote">'+esc(g.m[mod[g.id]])+'</div>';
 h+='<div class="warn">'+T('Ojo: ')+esc(g.w)+'</div>';h+=need(g.id);
 h+='<div class="prog"><i id="pb"></i></div><div class="pt" id="pt"></div><ol class="steps">';
 g.s.forEach(function(s,i){h+='<li data-i="'+i+'" class="'+(done[g.id].indexOf(i)>-1?"done":"")+'"><span class="ic">'+sart(g.so?g.so[i]:s)+'</span><span class="t"><b>'+gl(esc(s),g)+'</b><em>'+esc(dt(g,i))+'</em></span></li>'});
 h+='</ol><div class="pro">'+T('Cuándo llamar a un profesional: ')+esc(g.p)+'</div>';
 $("guide").innerHTML=h;prog();
}
function prog(){
 var n=done[cur.id].length,t=cur.s.length;
 $("pb").style.width=(n/t*100)+"%";
 $("pt").textContent=n===t?T("Listo, terminaste la guía."):n+T(" de ")+t+T(" pasos");
}
$("list").addEventListener("click",function(e){var b=e.target.closest(".row");if(b)open(b.dataset.id)});
$("guide").addEventListener("click",function(e){
 if(e.target.closest("#bk")){$("guide").hidden=true;$("home").hidden=false;try{history.replaceState(null,"",location.pathname)}catch(x){}return}
 var c=e.target.closest(".chip");if(c){mod[cur.id]=c.dataset.m;draw();return}
 var l=e.target.closest("li");if(l){
  var i=+l.dataset.i,a=done[cur.id],p=a.indexOf(i);
  if(p>-1)a.splice(p,1);else a.push(i);
  l.classList.toggle("done");prog();
 }
});
document.querySelector(".tabs").addEventListener("click",function(e){

{id:'cerradura',c:'casa',k:'Puertas',t:'La cerradura se atora',d:'La llave entra dura o no gira',mt:'Tipo de cerradura',m:{'De pomo':'Suelen traer un tornillo oculto bajo la tapa del pomo.','De chapa':'Casi siempre se atora por polvo dentro del cilindro.','Candado':'Aplica lubricante por el ojo de la llave y por el seguro.'},w:'Usa grafito o lubricante para cerraduras, no aceite de cocina: atrae polvo y la atora más.',s:['Revisa que la llave no esté doblada ni gastada; prueba con una copia.','Limpia la llave con un trapo seco.','Sopla en el ojo de la cerradura para sacar el polvo.','Aplica un poco de grafito o lubricante para cerraduras en la llave.','Mete y saca la llave varias veces, sin forzar.','Gira con calma y retira el exceso con un trapo.'],p:'Si la llave se rompió dentro o la puerta no abre, llama a un cerrajero.'},
{id:'puerta',c:'casa',k:'Puertas',t:'La puerta roza o no cierra',d:'Bisagras flojas o puerta caída',mt:'Tipo de puerta',m:{'De madera':'Los tornillos flojos suelen estar en la bisagra de arriba.','Metálica':'Revisa también que no haya óxido en las bisagras.','De clóset':'Casi siempre es un tornillo flojo de la bisagra superior.'},w:'Sostén la puerta con una cuña o pide ayuda antes de aflojar nada: puede caerse.',s:['Cierra la puerta despacio y mira en qué punto roza.','Levanta la puerta por la manija para ver si las bisagras están flojas.','Aprieta los tornillos de cada bisagra con el desarmador.','Mete palillos con pegamento en el hoyo si el tornillo gira en falso y vuelve a apretar.','Prueba abrir y cerrar varias veces.','Marca el punto que aún roza y lija ese borde poquito.'],p:'Si el marco está torcido o la madera podrida, llama a un carpintero.'},
{id:'plagas',c:'casa',k:'Plagas',t:'Hormigas o cucarachas en la cocina',d:'Cómo cortarles el paso sin regarlo todo',mt:'Qué plaga',m:{'Hormigas':'Siguen un camino fijo: busca por dónde entran.','Cucarachas':'Buscan comida, agua y rincones oscuros, sobre todo bajo el fregadero.','Otra':'Toma una foto del bicho y pregunta en una tienda de plaguicidas.'},w:'Guarda los productos lejos de niños y mascotas y no mezcles químicos.',s:['Saca la basura y guarda la comida en recipientes cerrados.','Limpia migajas y grasa de estufa, mesa y piso con agua y jabón.','Busca por dónde entran: grietas, tubería y marcos.','Sella las grietas pequeñas con silicón.','Coloca cebo o trampas lejos de niños y mascotas.','Seca el fregadero cada noche.','Revisa en una semana si bajó la plaga.'],p:'Si no baja en dos semanas o ves termitas, llama a un fumigador.'},
{id:'humedad',c:'casa',k:'Humedad',t:'Manchas de humedad o moho',d:'Quítalo y evita que regrese',mt:'Dónde está',m:{'En el baño':'Casi siempre falta ventilación.','En pared exterior':'Puede venir de una fuga o de la lluvia.','En el techo':'Puede venir de la azotea: revisa arriba antes de pintar.'},w:'Usa guantes y cubrebocas. Nunca mezcles cloro con vinagre ni con otro limpiador: sueltan gases tóxicos.',s:['Abre puertas y ventanas para ventilar.','Busca de dónde viene el agua: tubo, techo o vapor.','Ponte guantes y cubrebocas.','Lava el moho con agua y jabón y un cepillo.','Seca la pared por completo con un trapo.','Pinta con pintura antihongos cuando esté bien seca.'],p:'Si crece rápido, huele muy fuerte o hay fuga en la pared, llama a un plomero o albañil.'},
{id:'frenos',c:'auto',k:'Frenos',t:'Los frenos rechinan o vibran',d:'Qué observar antes de ir al taller',mt:'Tu carro',m:CARM('ubica en el manual el nivel de líquido de frenos.'),w:'Si el pedal baja hasta el fondo o el carro tarda en frenar, no manejes: llama a la grúa.',s:['Escucha cuándo suena: al frenar suave, fuerte o todo el tiempo.','Fíjate si el volante vibra al frenar.','Mira por el rin si la balata se ve muy delgada.','Checa el nivel del líquido de frenos en su depósito.','Anota qué rueda suena y cuándo.','Lleva el carro a revisar con esos datos.'],p:'Los frenos no se reparan en casa: balatas, discos y líquido los cambia un mecánico.'},
{id:'parche',c:'auto',k:'Llantas',t:'Parchar una llanta de emergencia',d:'Con tapón o sellador, solo para llegar al taller',mt:'Tu carro',m:CARM('confirma en el manual si trae kit de sellador o refacción.'),w:'Es temporal: llévala a vulcanizar y no pases de 80 km/h.',s:['Oríllate, pon las intermitentes y el freno de mano.','Busca el clavo o lo que la ponchó, sin sacarlo todavía.','Saca el objeto con pinzas.','Mete el tapón o aplica el sellador del kit según su instructivo.','Infla la llanta a la presión de la etiqueta.','Revisa con agua y jabón que ya no salgan burbujas.','Maneja despacio hasta un vulcanizador.'],p:'Si el costado de la llanta está dañado o abultado no se repara: cámbiala.'},
{id:'bateria',c:'auto',k:'Eléctrico',t:'El carro no da marcha',d:'Clic, luces débiles o nada',mt:'Tu carro',m:CARM('ubica la batería bajo el cofre y sus bornes.'),w:'Si la batería está hinchada o huele a huevo podrido, no la toques ni pases corriente.',s:['Gira la llave y escucha: ¿hace clic, nada, o gira pero no prende?','Revisa si las luces del tablero están débiles.','Mira que los bornes estén firmes y sin polvo blanco.','Prueba el claxon: si suena débil, la batería está baja.','Pasa corriente con otro carro (mira esa guía).','Déjalo andar 20 minutos si prendió.','Lleva a checar batería y alternador si vuelve a fallar.'],p:'Si la batería tiene más de 4 años o se repite, cámbiala en un taller.'});

<script>
(function(){
var TE=[
['luz','Read your electric meter','To know how much you use before the bill arrives','Meter type',{Digital:'Press the button or wait for the screen to rotate until you see kWh.',Dial:'Read the dials left to right; if the needle is between two numbers, take the lower one.'},'Just look at the meter. Do not open or move anything on it.',['Find the meter, usually at the entrance of the house.','Look for the reading marked kWh.','Write down the number and the date.','Repeat at the same time a few days later.','Subtract the readings to see how many kWh you use per day.'],'If the meter looks damaged or sparks, notify the power company.'],
['llave','Fix a dripping faucet','Shut off the water and replace the failing part','Faucet type',{'One handle':'Usually the cartridge fails; take it with you to the store as a sample.','Two handles':'Almost always the washer or the rubber seat.',Other:'Take a photo of the faucet and the part so they give you the right one.'},'Close the shut-off valve before taking it apart, or the bathroom floods.',['Close the shut-off valve under the sink or the main one.','Open the faucet to drain the remaining water.','Remove the handle: look for a cap or a small screw.','Take out the part that drips and bring it as a sample.','Install the new part and reassemble in reverse order.','Open the shut-off valve slowly and check that it no longer drips.'],'If the leak is inside the wall, call a plumber.'],
['apagador','Replace a light switch','When the light will not turn on or it pops','Switch type',{Single:'It has two wires; note which terminal each one goes to.','Three-way':'It has three wires; label them with tape before disconnecting.',Dimmer:'Check that the dimmer is compatible with your bulbs.'},'Switch off the breaker of that circuit and confirm with a tester that there is no power.',['Switch off the breaker of the circuit where the switch is.','Confirm with a voltage tester that there is no power.','Remove the cover and unscrew the switch.','Take a photo or label the wires before disconnecting them.','Connect the wires to the new switch just like the old one.','Fix it, put the cover on, switch the breaker on and test.'],'If you see burnt or melted wires, do not replace it yourself.'],
['pastilla','The breaker tripped','Power went out in part of the house','Your breaker box',{Breakers:'Look for the lever left in the middle or down.',Fuses:'A blown fuse looks black or has a broken filament.','Not sure':'Open the cover and look for the lever that differs from the rest.'},'If the breaker trips again, do not force it: there is a short or an overload.',['Unplug what was on in that area.','With a dry hand, push the lever fully down and then back up.','If it trips right away, leave it down.','Plug the appliances back in one by one to see which one fails.','Avoid several high-power appliances on the same extension cord.'],'If it trips often or smells burnt, call an electrician.'],
['quemadores','Clean the stove burners','So the flame comes out blue and even','Your stove brand',[ES,'check the manual for how to lift the grates and caps.','your stove'],'Do it with the stove cold and the gas off.',['Close the gas shut-off valve and turn off the controls.','Wait for it to cool and remove the grates and caps.','Soak the parts in hot water with degreaser.','Clear the holes in the burner ring with a brush or needle.','Dry everything well before reassembling.','Reassemble, open the gas and light it: the flame should be blue.'],'If the flame is yellow or large even when clean, call a gas technician.'],
['chispa','The stove does not spark','The burner or oven will not light','Your stove brand',[ES,'look for the igniter, the small metal tip next to the burner.','your stove'],'If you smell gas, stop sparking: close the valve and ventilate.',['Check that the gas is open and the tank is not empty.','If ignition is electric, check that it is plugged in.','Clean the igniter with a dry cloth.','Check that the burner holes are not clogged.','Try again; if it does not light, close the gas.'],'It may be the ignition module or the valve: call a technician.'],
['clima2','The AC does not cool','What to check before calling the technician','Your AC brand',[CL,'check on the remote that it is in cool mode (snowflake).','your unit'],'Do not open or put your hand in the outdoor unit while the AC is plugged in.',['Set cool mode at 24 °C or lower.','Close the doors and windows of the room.','Clean the filters (see the cleaning guide).','Check that the outdoor unit is on and its fan spins.','Remove leaves or dust from the outdoor unit without putting your hands in.','If there is ice on the indoor unit, turn it off and let it thaw.'],'If it stays the same, refrigerant gas may be missing: only a technician can refill it.'],
['tvimagen','The TV has no picture','It turns on but the screen is black','Your TV brand',[TV,'try another input with the Source or Input button on the remote.','your TV'],'Do not open the TV: it has live parts even when off.',['Confirm that the indicator light turns on.','Choose the right input (HDMI, antenna) with Source or Input.','Change the HDMI cable or try another port.','Unplug the TV from the wall for 60 seconds and plug it back in.','Try another device to find out whether the TV is failing.','If there is sound but no picture, it may be the screen.'],'Broken screen, lines, or no picture with sound: technician.'],
['tvwifi','Connect the TV to WiFi','To use apps and streaming services','Your TV brand',[TV,'the menu may be called General, Network or Connection.','your TV'],'Have the WiFi password handy; it is on the modem label.',['Turn on the TV and open Settings with the remote.','Go to Network or WiFi.','Choose your network and type the password.','If it does not connect, move the modem closer or restart it.','Unplug the TV for 60 seconds and try again.','Once connected, update the software from Settings.'],'If no device has internet, call your provider.'],
['abanico','The fan does not spin or spins slowly','Pedestal, table or ceiling fan','Fan type',{Pedestal:'Check that the pole and base are properly assembled.',Table:'Check the speed selector: it sometimes sticks.',Ceiling:'Check the breaker, the switch and the remote batteries.'},'Always unplug it before removing the grille or blades.',['Unplug it or switch off the breaker.','Check that the speed selector is not stuck.','Remove the grille and clean the dust off the blades.','Spin the blades by hand: they should move freely.','Plug it back in and test at high speed.','If it hums but does not spin, it may be the capacitor.'],'Damaged capacitor or motor: have a technician replace it.'],
['aceite','Check the oil level','Quick and without tools','Your car',[CAR,'check the manual for the oil type and amount.','your car'],'Do it with the engine off and cold; hot oil can burn you.',['Park on level ground and turn off the engine.','Open the hood and pull out the dipstick.','Wipe it, push it all the way in and pull it out again.','The oil should sit between the minimum and maximum marks.','If it is low, add the type your manual says little by little.','Wait a minute and measure again.'],'If the oil light comes on, turn off the engine and call a mechanic.'],
['presion','Check tire pressure','Less fuel use and longer-lasting tires','Your car',[CAR,'the pressure is on the label on the door frame.','your car'],'Use the pressure on the car label, not the one written on the tire.',['Check the tires cold, before driving.','Find the recommended pressure on the car label.','Remove the valve cap.','Press the gauge on and read the pressure.','Inflate or release air until you reach the recommended pressure.','Put the cap back and check the spare too.'],'If a tire loses air often, take it to a tire shop.'],
['plumas','Change the windshield wipers','When they streak or do not clean','Your car',[CAR,'compare the length of the old blade with the new one before installing.','your car'],'Hold the arm when lowering it: if it drops suddenly it can crack the glass.',['Lift the wiper arm.','Find the plastic lock where the blade attaches.','Press and slide the blade off.','Compare the new one with the old (same length).','Slide the new one in until you hear a click.','Lower the arm carefully and test with water.'],'If it still does not clean with new blades, have the motor checked at a shop.'],
['fusible','Change a car fuse','When the lighter, radio or lights stop working','Your car',[CAR,'the manual shows where the fuse box is and what each fuse protects.','your car'],'Never use a fuse with more amps: it can cause a fire.',['Turn off the car and remove the key.','Find the fuse box using the manual.','Pull out the fuse with the plastic puller.','Hold it up to the light: if the wire is broken, it is blown.','Put in a new one with the same amp rating.','Test the device that was failing.'],'If the fuse blows again, there is a short: see an automotive electrician.'],
['foco','Change a light bulb','The easiest: no tools','Bulb type',{LED:'Lasts years and uses little power; check that the base matches the old bulb.',CFL:'Contains gas: if it breaks, ventilate the room and pick it up with gloves.',Incandescent:'Gets very hot; wait for it to cool.'},'Turn off the switch and let the bulb cool before touching it.',['Turn off the switch and wait for it to cool.','Turn the old bulb counterclockwise until it comes out.','Compare the base and wattage with the new one.','Screw in the new one clockwise, without overtightening.','Turn on the switch and test.'],'If the new bulb also burns out often, check the socket or call an electrician.'],
['fregadero','Unclog the kitchen sink','When the water will not drain','Drain type',{'Single basin':'Block the overflow with a wet cloth before using the plunger.','Double basin':'Block the other drain with a wet cloth so it builds pressure.','With disposal':'Turn it off and do not put your hand in: use tongs or a long spoon.'},'Do not mix chemical drain cleaners or use them before the plunger.',['Remove the standing water with a cup or bucket.','Block the overflow with a wet cloth.','Place the plunger over the drain and pump hard 10 times.','If it does not drain, put a bucket under and unscrew the trap (the U underneath).','Clean out whatever is inside and put it back together.','Run hot water for a few minutes to flush.'],'If several drains clog at once, the problem is the main pipe: call a plumber.'],
['wc','The toilet keeps running','The tank keeps filling','Tank type',{'Ball float':'Carefully bend the float arm down to cut the water first.','Cup float':'Adjust with the screw or tab on the float.','Not sure':'Open the tank lid and see what rises and falls as it fills.'},'If it overflows, close the shut-off valve next to the toilet.',['Carefully remove the tank lid.','Check whether the float sits too high or is stuck.','Adjust it so the water stops below the overflow tube.','Check that the chain is not caught under the flapper.','Clean the rubber flapper at the bottom; if it is hard, replace it.','Pull the handle and check that it now stops.'],'If it keeps running with new parts, have a plumber check it.'],
['boiler','There is no hot water','What to check on your water heater','Heater type',{Tank:'Check that the temperature selector is not at minimum.',Tankless:'Open the tap fully: some only start with good flow.',Solar:'If it is cloudy or night, it is normal for it to take longer.'},'If you smell gas, close the gas valve, ventilate and do not light anything.',['Confirm there is gas (or power, if electric) and the tank is not empty.','Check the selector temperature.','Open the hot water taps fully.','If it has a pilot, check that it is lit.','To light the pilot, follow the instructions on the unit label.','Wait a few minutes and test the water.'],'If it does not light after following the label, call a technician; do not handle the gas valve.'],
['refri','The fridge is not cooling well','What to check before calling the technician','Your fridge brand',[APL,'look in the manual for where the temperature control is.','your fridge'],'Unplug the fridge before cleaning behind or under it.',['Check that the temperature control is not at minimum.','Check that the door seals well: the gasket must not be torn.','Do not overfill it: air must circulate.','Leave 10 cm between the wall and the back.','Unplugged, brush the dust off the condenser.','Plug it back in and wait 24 hours to see if the temperature drops.'],'If you cannot hear the motor or there is heavy frost, call a technician.'],
['control','The TV remote does not work','No response or only sometimes','Your TV brand',[TV,'you can use the brand phone app while you fix the remote.','your TV'],'If the batteries are swollen or corroded, remove them carefully and wash your hands.',['Replace the batteries with new ones.','Point straight at the TV sensor and get closer.','Remove anything covering the sensor.','Look at the remote LED through your phone camera: you should see a flash.','Unplug the TV for 60 seconds and try again.','If it is Bluetooth, pair it again following the manual.'],'If nothing works, buy a replacement remote for your model.'],
['anticong','Check the coolant','So the engine does not overheat','Your car',[CAR,'check the manual for the coolant type and mix.','your car'],'Never open the cap with a hot engine: steam comes out and burns.',['With the engine cold, open the hood.','Find the translucent coolant reservoir.','Check that the level is between MIN and MAX.','If it is low, add the mix your manual says.','Close the cap tightly.','Look for green or pink stains under the car.'],'If it drops often or you see stains, there is a leak: see a mechanic.'],
['faro','Change a headlight bulb','When a front light has burned out','Your car',[CAR,'the manual shows the bulb type and how to reach behind the headlight.','your car'],'With the car off and cold; do not touch the glass of the new bulb with your fingers.',['Turn off the car and wait for it to cool.','Open the hood and find the back of the headlight.','Unplug the bulb connector.','Twist or release the lock and take out the bulb.','Install the new one without touching the glass.','Connect it, turn on the lights and test.'],'If the new bulb burns out often, there may be an electrical problem.'],
['tablero','What the dashboard lights mean','Red, yellow and green','Your car',[CAR,'the manual has the exact meaning of each symbol.','your car'],'If a red light comes on, stop as soon as it is safe.',['Red: oil, temperature, brakes. Turn off the engine as soon as you can.','Battery light: charging may be failing; find a nearby shop.','Yellow: check engine, ABS, tire pressure. Check soon.','If the check engine light flashes, do not accelerate hard and go to the shop.','Green or blue: informational only (lights, turn signals).','Compare the symbol with your car manual.'],'With any red light, do not keep driving; call a tow truck or a mechanic.'],
['contacto','An outlet has no power','The wall outlet does not work','Outlet type',{Single:'Check that the wires are firm on the side screws.',Double:'Sometimes only one half fails; test both sockets.',Grounded:'The third wire (green or bare) goes to the ground screw.'},'Switch off the breaker of that circuit and confirm with a tester that there is no power before touching anything.',['Test the outlet with another device to see whether the outlet or the device is failing.','Switch off the breaker of the circuit where the outlet is.','Confirm with a voltage tester that there is no power.','Remove the cover and unscrew the outlet from the wall.','Check whether any wire is loose, black or burnt.','Tighten the screw of each wire without overdoing it.','Fix the outlet, put the cover on, switch the breaker on and test.'],'If you see black or melted wires or smell burning, do not touch it: call an electrician.'],
['horno','The oven does not heat','What to check before calling the technician','Your stove brand',[ES,'the manual shows where the oven knob and the pilot or ignition are.','your stove'],'If you smell gas, close the gas valve, ventilate and do not light anything.',['Check that the gas is open and the tank is not empty.','Turn the oven knob to the temperature you want.','If it is gas and has a pilot, check that it is lit.','Check that the oven door closes well.','Remove trays or paper blocking the heat outlet.','Wait about 10 minutes and check whether it heats.'],'If it does not light or the flame is yellow, call a gas technician.'],
['campana','Clean the range hood filter','So it pulls smoke and grease better','Hood type',{'Aluminum filter':'Wash it with hot water and degreaser.','Carbon filter':'Do not wash it: replace it with a new one of the same model.','Not sure':'Remove the filter and look: if it is metal with small holes, it can be washed.'},'Turn off the hood and the stove, and wait for them to cool.',['Turn off the hood and the stove and wait for them to cool.','Open the underside of the hood and find the filter.','Slide or pull the filter out.','Soak it in hot water with degreaser.','Scrub with a soft brush and rinse.','Let it dry well and put it back.','Turn on the hood and test.'],'If the motor makes a strange noise or does not pull even when clean, call a technician.'],
['lavadora','The washer does not drain','It keeps water at the end','Your washer brand',[APL,'look in the manual for the pump filter, almost always low at the front.','your washer'],'Unplug it and keep towels handy: water comes out.',['Unplug the washer from the wall.','Check that the drain hose is not bent.','Check that the hose is not clogged or too low.','Find the filter cap and put a bucket under it.','Open the filter slowly and let the water out.','Remove lint, coins or stuck socks.','Close the filter, plug in and test a drain cycle.'],'If it still does not drain, it may be the pump: call a technician.'],
['filtroaire','Change the engine air filter','So it breathes better and uses less fuel','Your car',[CAR,'the manual shows where the filter box is and its size.','your car'],'Do it with the engine off and cold.',['Turn off the engine, wait for it to cool and open the hood.','Find the black air filter box.','Release the clips or screws on the cover.','Take out the old filter and hold it up to the light.','Compare the new one with the old: same size and shape.','Put the new one in and make sure it sits evenly.','Close the cover, fasten the clips and close the hood.'],'If the engine jerks or uses a lot of fuel even with a new filter, take it to the shop.'],
['bornes','Clean the battery terminals','White or green powder and no start','Your car',[CAR,'find the battery and its (+) and (−) terminals under the hood.','your car'],'Wear gloves and glasses: battery powder is acid. Remove the negative (−) cable first.',['Turn off the car, remove the key and open the hood.','Find the battery terminals: positive (+) and negative (−).','Loosen and remove the negative (−) cable first.','Then loosen and remove the positive (+) cable.','Clean the powder off with a brush and baking soda water.','Dry the terminals and the cable ends well.','Connect the positive (+) first and the negative (−) last.','Tighten firmly and test whether it starts.'],'If the battery is swollen, leaking or more than 4 years old, replace it at a shop.'],
['regadera','The shower has low water flow','The holes get clogged with limescale','Shower type',{'Wall-mounted':'Unscrew it from the pipe by turning it left.',Handheld:'Unscrew it from the hose; it is easier to clean.','Long arm':'Hold the arm with one hand so you do not strain the pipe.'},'Turn off the hot water before touching it so you do not burn yourself.',['Close the water taps and wait until it stops dripping.','Unscrew the shower head by turning it left.','Check the holes: white dust means limescale.','Soak it for an hour in a bucket with vinegar and water.','Scrub the holes with an old toothbrush.','Rinse with clean water and check that water passes through every hole.','Put teflon tape on the thread, screw the head on and open the water.'],'If it still has low flow, the pipe may be clogged: call a plumber.'],
['cambioaceite','Change the engine oil','New oil and filter, step by step','Your car',[CAR,'the manual says which oil, how many liters and which filter it needs.','your car'],'Do it with a warm engine, not hot. Never get under a car that is only on a jack: use ramps or sturdy stands.',['Gather oil and filter of the type in the manual, a wrench, a pan, a funnel and gloves.','Warm the engine for 2 minutes, turn it off and raise the car on ramps or sturdy stands.','Put the pan under the oil pan plug and loosen it with the wrench.','Remove the plug by hand and let all the old oil drain.','Replace the washer, put the plug in and tighten it firmly without overdoing it.','Loosen the old filter with the filter wrench and let it drip.','Rub oil on the new filter gasket and screw it on by hand only.','Lower the car, open the oil cap and pour in the new oil with the funnel.','Check with the dipstick that the level is between the two marks.','Start it, wait 1 minute and check that nothing drips underneath.'],'Take used oil in a sealed container to a shop or collection center; do not pour it down the drain.'],
['sobrecal','The engine overheats','The temperature needle goes into the red','Your car',[CAR,'the temperature light is a thermometer with waves; if it comes on, stop.','your car'],'Never open the radiator or reservoir cap with a hot engine: steam comes out and burns.',['When you see the needle in the red, pull over and turn off the engine.','Turn on the hazard lights and open the hood only with the interior lever, without touching the engine.','Wait at least 30 minutes for it to cool.','Look for steam, liquid stains underneath or broken hoses.','With the engine cold, check the coolant reservoir level.','If it is low, refill with the mix in your manual; in an emergency, clean water.','Start it and check that the needle stays in the middle.','If it rises again, turn it off and call a tow truck.'],'If there is a leak, the reservoir empties fast or it overheats again, do not keep driving: call a tow truck.'],
['cambiobat','Replace the car battery','When it will not start even with a jump','Your car',[CAR,'the battery is usually under the hood, to one side; the manual says what size it takes.','your car'],'Wear gloves and glasses. Always remove the negative (−) cable first and connect it last.',['Turn off the car, remove the key and open the hood.','Take a photo of how the cables are connected.','Loosen and remove the negative (−) cable first.','Then loosen and remove the positive (+) cable.','Remove the clamp that holds the battery.','Take out the old battery with both hands, upright and without tilting it.','Put the new one in the same place and secure it with the clamp.','Connect the positive (+) first and the negative (−) last.','Tighten the terminals firmly and start the car.'],'Return the old battery to the store where you buy the new one; do not throw it in the trash.'],
['parpadea','The bulb flickers or burns out often','Almost always the bulb, the socket or a loose wire','Bulb type',{LED:'Some LEDs flicker if the switch has a pilot light or is not compatible.',CFL:'It is normal for it to take a while to light and last less if switched on and off a lot.',Incandescent:'It burns out sooner; check that it is not a higher wattage than the fixture supports.'},'Turn off the switch, switch off the breaker of that circuit and let the bulb cool before touching it.',['Turn off the switch, switch off the breaker and let the bulb cool for a few minutes.','Unscrew the bulb by turning it left.','Check that the bulb is not blackened or loose in the base.','Try another bulb you know works.','Look at the socket: if the center tab is flattened, lift it gently with a wooden stick.','Check that the bulb wattage does not exceed what the fixture says.','Screw the bulb in firmly, without overdoing it, switch the breaker on and turn it on.'],'If several bulbs in the house flicker or it smells burnt, it may be the wiring: call an electrician.'],
['empana','The windshield fogs up','To see well in cold or rain','Your car',[CAR,'look on the dashboard for the button with the windshield and curved arrows.','your car'],'If you cannot see well, pull over and stop: driving without visibility is very dangerous.',['Turn on the defogger: the button with the windshield and arrows.','Turn up the fan and aim the air at the windshield.','Set the temperature to hot at first to dry it quickly.','Turn on the A/C: it removes moisture from the air.','Turn off recirculation and let outside air in.','Lower the windows a little so moisture escapes.','Clean the inside with a dry, clean microfiber cloth.'],'If the glass fogs up very often or the car floor is wet, there may be a water leak: have it checked at a shop.'],
['cerradura','The lock sticks','The key goes in hard or will not turn','Lock type',{Knob:'They usually have a hidden screw under the knob cap.',Latch:'Almost always sticks because of dust inside the cylinder.',Padlock:'Apply lubricant through the keyhole and on the shackle.'},'Use graphite or lock lubricant, not cooking oil: it attracts dust and makes it stick more.',['Check that the key is not bent or worn; try a copy.','Wipe the key with a dry cloth.','Blow into the keyhole to remove dust.','Apply a little graphite or lock lubricant to the key.','Put the key in and out several times, without forcing.','Turn it gently and wipe off the excess with a cloth.'],'If the key broke inside or the door will not open, call a locksmith.'],
['puerta','The door rubs or will not close','Loose hinges or a sagging door','Door type',{Wooden:'The loose screws are usually in the top hinge.',Metal:'Also check for rust on the hinges.',Closet:'Almost always a loose screw in the top hinge.'},'Hold the door with a wedge or ask for help before loosening anything: it can fall.',['Close the door slowly and see where it rubs.','Lift the door by the handle to see whether the hinges are loose.','Tighten the screws of each hinge with the screwdriver.','If a screw spins freely, put toothpicks with glue in the hole and tighten again.','Test opening and closing several times.','Mark the spot that still rubs and sand that edge a little.'],'If the frame is warped or the wood is rotten, call a carpenter.'],
['plagas','Ants or cockroaches in the kitchen','How to cut off their way in without making a mess','Which pest',{Ants:'They follow a fixed path: find where they come in.',Cockroaches:'They look for food, water and dark corners, especially under the sink.',Other:'Take a photo of the bug and ask at a pesticide store.'},'Keep products away from children and pets and do not mix chemicals.',['Take out the trash and keep food in sealed containers.','Clean crumbs and grease from the stove, table and floor with soap and water.','Find where they get in: cracks, pipes and frames.','Seal small cracks with silicone.','Place bait or traps away from children and pets.','Dry the sink every night.','Check in a week whether the infestation went down.'],'If it does not go down in two weeks or you see termites, call an exterminator.'],
['humedad','Damp stains or mold','Remove it and keep it from coming back','Where is it',{'In the bathroom':'Almost always lacks ventilation.','On an exterior wall':'It may come from a leak or from rain.','On the ceiling':'It may come from the roof: check up there before painting.'},'Wear gloves and a mask. Never mix bleach with vinegar or another cleaner: they release toxic gases.',['Open doors and windows to ventilate.','Find where the water comes from: pipe, roof or steam.','Put on gloves and a mask.','Wash the mold off with soap, water and a brush.','Dry the wall completely with a cloth.','Paint with anti-mold paint once it is fully dry.'],'If it grows fast, smells very strong or there is a leak in the wall, call a plumber or a mason.'],
['frenos','The brakes squeal or shake','What to watch for before going to the shop','Your car',[CAR,'find the brake fluid level in the manual.','your car'],'If the pedal goes all the way down or the car is slow to stop, do not drive: call a tow truck.',['Listen for when it sounds: light braking, hard braking or all the time.','Notice whether the steering wheel shakes when braking.','Look through the wheel to see whether the brake pad looks very thin.','Check the brake fluid level in its reservoir.','Note which wheel makes the noise and when.','Take the car to be checked with that information.'],'Brakes are not repaired at home: a mechanic changes pads, discs and fluid.'],
['parche','Patch a tire in an emergency','With a plug or sealant, only to reach the shop','Your car',[CAR,'check the manual for whether it has a sealant kit or a spare.','your car'],'It is temporary: take it to a tire shop and do not go over 80 km/h.',['Pull over, turn on the hazard lights and set the parking brake.','Find the nail or whatever punctured it, without removing it yet.','Pull the object out with pliers.','Insert the plug or apply the kit sealant following its instructions.','Inflate the tire to the pressure on the label.','Check with soap and water that no more bubbles come out.','Drive slowly to a tire shop.'],'If the tire sidewall is damaged or bulging, it cannot be repaired: replace it.'],
['bateria','The car will not start','Click, dim lights or nothing','Your car',[CAR,'find the battery under the hood and its terminals.','your car'],'If the battery is swollen or smells like rotten eggs, do not touch it or jump-start.',['Turn the key and listen: does it click, do nothing, or turn but not start?','Check whether the dashboard lights look dim.','Check that the terminals are firm and without white powder.','Try the horn: if it sounds weak, the battery is low.','Jump-start it with another car (see that guide).','Let it run for 20 minutes if it started.','Have the battery and alternator checked if it fails again.'],'If the battery is more than 4 years old or it keeps happening, replace it at a shop.']];
