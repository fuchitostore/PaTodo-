var CA=XM(CAR,'ubica en el manual las tapas de cada depósito.','find the reservoir caps in the manual.'),AA=XM(CAR,'busca en el manual dónde está el filtro del A/C, casi siempre tras la guantera.','look in the manual for the A/C filter, almost always behind the glove box.'),IN=XM(CAR,'el manual indica cómo cambiar los focos de las direccionales.','the manual shows how to change the turn signal bulbs.'),GS=XM(CAR,'la luz de reserva se enciende con pocos litros: no la ignores.','the reserve light comes on with a few liters left: do not ignore it.'),ST=XM(CAR,'revisa en el manual el diagrama de cambios de la palanca.','check the manual for the gear shift diagram.');
N('wctapado','casa','Plomería',['El WC está tapado','El agua sube y no baja','Tipo de WC',{'De tanque':'El más común; casi siempre se destapa con ventosa de campana.','De fluxómetro':'Usa una ventosa grande y bombea despacio para no salpicar.'},'Si el agua sube hacia el borde, no jales otra vez: cierra la llave de paso junto al WC.',['Cierra la llave de paso del WC si el agua sube.','Ponte guantes y pon trapos o periódico en el piso.','Mete la ventosa bien sellada sobre el hoyo.','Bombea fuerte y constante 10 veces sin despegarla.','Jala la palanca y checa que baje el agua.','Si no baja, repite o usa un destapador de resorte.'],'Si varios drenajes de la casa fallan o regresa agua sucia, llama a un plomero.'],['The toilet is clogged','Water rises and will not go down','Toilet type',{'Tank':'The most common; it is almost always cleared with a flange plunger.','Flushometer':'Use a large plunger and pump slowly to avoid splashing.'},'If the water rises toward the rim, do not flush again: close the shut-off valve next to the toilet.',['Close the toilet shut-off valve if the water is rising.','Put on gloves and lay rags or newspaper on the floor.','Place the plunger well sealed over the hole.','Pump hard and steadily 10 times without lifting it.','Flush and check that the water goes down.','If it does not, repeat or use a toilet auger.'],'If several drains in the house fail or dirty water comes back, call a plumber.'],['ven,guan',20,0,0]);
N('fugalavabo','casa','Plomería',['Fuga bajo el lavabo','Goteo en la tubería o las conexiones','Dónde gotea',{'En el sifón (la U)':'Casi siempre es una tuerca floja o el empaque.','En la manguera de la llave':'Revisa la tuerca de cada extremo.','En la llave de paso':'Aprieta con cuidado la tuerca del vástago; si sigue, cámbiala.'},'Cierra la llave de paso antes de apretar o desarmar.',['Cierra la llave de paso y pon una cubeta debajo.','Seca todo con un trapo para ver de dónde gotea.','Aprieta a mano la tuerca que gotea y luego un cuarto de vuelta con la llave.','Si sigue, desármala y cambia el empaque o la rondana.','Pon cinta de teflón en las roscas de metal.','Abre la llave de paso despacio y vigila unos minutos.'],'Si el tubo está roto o corroído, llama a un plomero.'],['Leak under the sink','Dripping from the pipes or fittings','Where it leaks',{'At the trap (the U)':'Almost always a loose nut or the gasket.','At the faucet hose':'Check the nut at each end.','At the shut-off valve':'Carefully tighten the stem nut; if it keeps leaking, replace it.'},'Close the shut-off valve before tightening or taking anything apart.',['Close the shut-off valve and put a bucket underneath.','Dry everything with a cloth to see where it drips from.','Tighten the leaking nut by hand and then a quarter turn with the wrench.','If it keeps leaking, take it apart and replace the gasket or washer.','Put teflon tape on the metal threads.','Open the shut-off valve slowly and watch for a few minutes.'],'If the pipe is cracked or corroded, call a plumber.'],['llav,cint,cub,trap',30,1,0]);
N('gotera','casa','Humedad',['Gotera en el techo','Qué hacer mientras llega la reparación','Tipo de techo',{'Losa':'Suele filtrar por grietas o por impermeabilizante viejo.','Lámina':'Casi siempre es un tornillo flojo o una junta abierta.','Teja':'Revisa si hay tejas movidas o rotas.'},'No subas al techo mojado ni con lluvia: es peligroso. Si el agua cae cerca de lámparas o contactos, baja la pastilla de esa zona.',['Pon una cubeta bajo la gotera y quita lo que se pueda mojar.','Si el techo se hincha, hazle un hoyito para que drene a la cubeta.','Baja la pastilla si el agua cae cerca de lámparas o contactos.','Cuando pare la lluvia, revisa la azotea: grietas y coladeras tapadas.','Limpia las coladeras de hojas y basura.','Sella grietas pequeñas con impermeabilizante.','Marca el contorno de la mancha para ver si crece.'],'Si la mancha crece o hay goteras en varios lugares, llama a un impermeabilizador.'],['Roof leak','What to do until the repair arrives','Roof type',{'Concrete slab':'It usually leaks through cracks or old waterproofing.','Metal sheet':'Almost always a loose screw or an open seam.','Tile':'Check for shifted or broken tiles.'},'Do not climb onto a wet roof or in the rain: it is dangerous. If water falls near lamps or outlets, switch off the breaker for that area.',['Put a bucket under the leak and move away whatever can get wet.','If the ceiling bulges, poke a small hole so it drains into the bucket.','Switch off the breaker if water falls near lamps or outlets.','When the rain stops, check the roof: cracks and clogged drains.','Clear the drains of leaves and trash.','Seal small cracks with waterproofing sealant.','Mark the outline of the stain to see whether it grows.'],'If the stain grows or there are leaks in several places, call a waterproofing contractor.'],['cub,cep',45,1,1]);
N('taladro','casa','Reparaciones',['Colgar un cuadro o taladrar','Con taquetes, sin romper la pared','Tipo de pared',{'Tablaroca':'Usa taquete de expansión para tablaroca; los clavos solos no aguantan peso.','Concreto o tabique':'Usa broca para concreto y taquete de plástico.','Madera':'Basta un tornillo para madera; no necesita taquete.'},'Antes de taladrar, evita las líneas de contactos y apagadores: pueden llevar cables o tubos.',['Marca con lápiz el punto exacto y revisa con nivel.','Elige una broca del mismo grosor que el taquete.','Taladra a la profundidad del taquete, sin forzar.','Limpia el polvo del hoyo.','Mete el taquete con golpecitos suaves hasta que quede al ras.','Atornilla el tornillo y cuelga el cuadro.'],'Si perforas un tubo o sale agua, cierra la llave de paso general y llama a un plomero.'],['Hang a picture or drill','With wall plugs, without breaking the wall','Wall type',{'Drywall':'Use drywall expansion anchors; nails alone cannot hold weight.','Concrete or brick':'Use a masonry bit and a plastic wall plug.','Wood':'A wood screw is enough; it does not need a plug.'},'Before drilling, avoid the lines above outlets and switches: they may carry wires or pipes.',['Mark the exact spot with a pencil and check with a level.','Choose a bit the same thickness as the plug.','Drill to the depth of the plug, without forcing.','Clean the dust out of the hole.','Tap the plug in gently until it is flush.','Drive in the screw and hang the picture.'],'If you hit a pipe or water comes out, close the main shut-off valve and call a plumber.'],['tal,niv',30,1,1]);
N('pintar','casa','Reparaciones',['Resanar y pintar una pared','Para que quede parejo','Tipo de pintura',{'Vinílica':'Se diluye y se limpia con agua.','Esmalte':'Se diluye con thinner; ventila muy bien.'},'Ventila el cuarto y usa cubrebocas con esmalte o thinner.',['Cubre muebles y piso con plástico y pon cinta en bordes y contactos.','Rellena hoyos y grietas con resanador y déjalo secar.','Lija el resanador hasta que quede parejo y limpia el polvo.','Aplica sellador si la pared es nueva o está manchada.','Pinta con rodillo y brocha en las esquinas.','Deja secar y da una segunda mano.','Quita la cinta antes de que seque por completo.'],'Si hay moho o humedad, resuélvelo primero (mira esa guía) o la pintura se despega.'],['Patch and paint a wall','So it comes out even','Paint type',{'Vinyl':'Thinned and cleaned up with water.','Enamel':'Thinned with thinner; ventilate very well.'},'Ventilate the room and wear a mask with enamel or thinner.',['Cover furniture and floor with plastic and tape the edges and outlets.','Fill holes and cracks with filler and let it dry.','Sand the filler until even and wipe off the dust.','Apply primer if the wall is new or stained.','Paint with a roller and a brush in the corners.','Let it dry and apply a second coat.','Remove the tape before it dries completely.'],'If there is mold or damp, fix that first (see that guide) or the paint will peel.'],['pint,lija,trap',120,1,1]);
N('descongelar','casa','Línea blanca',['Descongelar el refri','Cuando hay mucho hielo en el congelador','Tipo de refri',{'Con escarcha':'Hay que descongelarlo a mano de vez en cuando.','No Frost':'No debería juntar hielo; si lo hace, puede fallar el desagüe o el hule de la puerta.'},'No uses cuchillos ni picahielos para quitar el hielo: puedes perforar el tubo.',['Saca la comida y guárdala en hieleras.','Desconecta el refri y deja las puertas abiertas.','Pon toallas y una charola abajo para el agua.','Espera de 4 a 8 horas; ayuda con un recipiente de agua tibia dentro.','Limpia con agua y bicarbonato y seca bien.','Conecta, espera una hora y vuelve a meter la comida.'],'Si junta hielo seguido, revisa el hule de la puerta; si está bien, llama a un técnico.'],['Defrost the fridge','When there is a lot of ice in the freezer','Fridge type',{'Frost':'It has to be defrosted by hand once in a while.','No Frost':'It should not build up ice; if it does, the drain or the door gasket may be failing.'},'Do not use knives or ice picks to remove the ice: you can puncture the tube.',['Take the food out and keep it in coolers.','Unplug the fridge and leave the doors open.','Put towels and a tray underneath for the water.','Wait 4 to 8 hours; a bowl of warm water inside helps.','Clean with water and baking soda and dry well.','Plug it in, wait an hour and put the food back.'],'If it builds up ice often, check the door gasket; if it is fine, call a technician.'],['hiel,trap',30,0,0]);
N('licuadora','casa','Cocina',['La licuadora no prende','Qué revisar antes de comprar otra','Tipo de licuadora',{'Vaso de vidrio':'Revisa que el vaso esté bien enroscado: si no, no arranca.','Vaso de plástico':'Revisa que la base asiente completa y gire parejo.'},'Desconéctala siempre antes de tocar las aspas o la base.',['Prueba el contacto con otro aparato.','Revisa el cable y el enchufe: que no estén dañados.','Desconecta y asegúrate de que el vaso y la base asienten bien.','Gira las aspas con un utensilio para ver que no estén atoradas.','Limpia la base del vaso y el cople de hule.','Prueba en velocidad baja y sube poco a poco.'],'Si huele a quemado o zumba sin girar, el motor falló: mejor reemplázala.'],['The blender will not turn on','What to check before buying another','Blender type',{'Glass jar':'Check that the jar is screwed on properly: otherwise it will not start.','Plastic jar':'Check that the base sits fully and turns evenly.'},'Always unplug it before touching the blades or the base.',['Test the outlet with another device.','Check the cord and plug: they must not be damaged.','Unplug it and make sure the jar and the base seat properly.','Turn the blades with a utensil to see that they are not stuck.','Clean the jar base and the rubber coupling.','Try low speed and raise it little by little.'],'If it smells burnt or hums without turning, the motor failed: better replace it.'],['dest,trap',15,0,0]);
N('cortes','casa','Emergencias',['Cortar la luz, el agua o el gas general','Para una emergencia en casa','Qué quieres cortar',{'La luz':'Busca el interruptor general en el centro de carga o junto al medidor.','El agua':'Busca la llave de paso general, casi siempre cerca del medidor o en la entrada de la casa.','El gas':'La llave está junto al tanque o al medidor.'},'Con la mano seca y sin pisar agua. Si hay chispas o humo, no te acerques: sal y llama a emergencias.',['Identifica la emergencia: fuga, corto o incendio pequeño.','Si es fuga de agua, cierra la llave de paso general.','Si hay corto o chispas, baja el interruptor general del centro de carga.','Si huele a gas, cierra la llave del gas y ventila.','Avisa a quienes estén en casa.','Llama a quien corresponda antes de volver a abrir.'],'Ante fuego o humo, sal primero y llama al 911.'],['Shut off power, water or gas','For an emergency at home','What do you want to shut off',{'Power':'Look for the main switch in the breaker box or next to the meter.','Water':'Look for the main shut-off valve, usually near the meter or at the entrance of the house.','Gas':'The valve is next to the tank or the meter.'},'With a dry hand and without stepping in water. If there are sparks or smoke, do not go near: get out and call emergency services.',['Identify the emergency: leak, short circuit or small fire.','If it is a water leak, close the main shut-off valve.','If there is a short or sparks, switch off the main breaker in the breaker box.','If you smell gas, close the gas valve and ventilate.','Warn everyone in the house.','Call the right service before turning anything back on.'],'With fire or smoke, get out first and call 911.'],['',5,0,0]);
N('niveles','auto','Motor',['Revisar los niveles del carro','Frenos, limpiaparabrisas y dirección','Tu carro',CA[0],'Con el motor frío y en piso plano. Si el líquido de frenos está bajo, no manejes: puede haber fuga.',['Estaciona en piso plano y apaga el motor.','Abre el cofre y ubica los depósitos con ayuda del manual.','Líquido de frenos: debe estar entre MIN y MAX.','Limpiaparabrisas: rellena con agua y limpiador, nunca con anticongelante.','Dirección hidráulica (si tiene): mide con la varilla de la tapa.','Cierra bien todas las tapas y el cofre.'],'Si frenos o dirección están bajos, hay fuga: revisa en un taller.'],['Check the car fluid levels','Brakes, wipers and steering','Your car',CA[1],'With the engine cold and on level ground. If the brake fluid is low, do not drive: there may be a leak.',['Park on level ground and turn off the engine.','Open the hood and find the reservoirs with the help of the manual.','Brake fluid: it should be between MIN and MAX.','Washer fluid: refill with water and cleaner, never with coolant.','Power steering (if equipped): measure with the cap dipstick.','Close all the caps and the hood tightly.'],'If brakes or steering are low, there is a leak: have it checked at a shop.'],['man,trap',15,0,0]);
N('acauto','auto','Clima',['El A/C del carro no enfría','Qué revisar antes del taller','Tu carro',AA[0],'No intentes recargar el gas del A/C con kits caseros: es presión alta y se daña el sistema.',['Pon el A/C en frío máximo, ventilador alto y recirculado.','Escucha el compresor y checa que el condensador (adelante del radiador) esté limpio de hojas.','Revisa el fusible del A/C en la caja de fusibles.','Cambia el filtro de cabina si está sucio.','Déjalo encendido unos minutos y checa si sale aire frío.','Si sale tibio, anota cuándo pasa y llévalo al taller.'],'Falta de gas o falla del compresor: solo un taller lo carga y repara.'],['The car A/C does not cool','What to check before the shop','Your car',AA[1],'Do not try to recharge the A/C gas with DIY kits: it is high pressure and can damage the system.',['Set the A/C to maximum cold, high fan and recirculation.','Listen for the compressor and check that the condenser (in front of the radiator) is free of leaves.','Check the A/C fuse in the fuse box.','Replace the cabin filter if it is dirty.','Leave it on for a few minutes and check whether cold air comes out.','If it is warm, note when it happens and take it to the shop.'],'Low gas or compressor failure: only a shop can recharge and repair it.'],['man,cel',20,1,0]);
N('intermitentes','auto','Luces',['Las intermitentes no sirven','Parpadean rápido o no encienden','Tu carro',IN[0],'Con el carro apagado y la llave fuera. No toques el vidrio de un foco nuevo con los dedos.',['Prende las intermitentes y mira cuáles no sirven.','Si parpadean muy rápido, casi siempre es un foco fundido de ese lado.','Revisa el fusible de las direccionales en la caja de fusibles.','Cambia el foco del lado que falla.','Prueba otra vez y checa que parpadeen a ritmo normal.'],'Si el foco y el fusible están bien y no prenden, puede ser el relevador o el interruptor: ve al taller.'],['The turn signals do not work','They blink fast or do not light','Your car',IN[1],'With the car off and the key out. Do not touch the glass of a new bulb with your fingers.',['Turn on the hazard lights and see which ones do not work.','If they blink very fast, it is almost always a burned-out bulb on that side.','Check the turn signal fuse in the fuse box.','Replace the bulb on the side that fails.','Test again and check that they blink at a normal pace.'],'If the bulb and the fuse are fine and they do not light, it may be the relay or the switch: go to the shop.'],['rep,man',15,0,0]);
N('singas','auto','Motor',['Me quedé sin gasolina','Qué hacer y cómo evitarlo','Tu carro',GS[0],'No te quedes en la carretera de noche sin intermitentes y sin avisar a alguien.',['Oríllate con calma, pon las intermitentes y el freno de mano.','Si estás en carretera, sal por el lado contrario al tráfico y aléjate.','Llama a la grúa o a alguien que te lleve gasolina en un bidón apropiado.','Si te traen gasolina, echa solo unos 3 a 5 litros.','Gira la llave un momento sin arrancar para llenar la línea; luego arranca.','Carga en cuanto llegues a una gasolinera.'],'Si arranca pero se apaga, puede ser la bomba o el filtro: ve al taller.'],['I ran out of gas','What to do and how to avoid it','Your car',GS[1],'Do not stay on the highway at night without hazard lights and without telling someone.',['Pull over calmly, turn on the hazard lights and set the parking brake.','If you are on a highway, get out on the side away from traffic and move away.','Call a tow truck or someone to bring you gas in a proper gas can.','If they bring you gas, add only about 3 to 5 liters.','Turn the key for a moment without starting to fill the line; then start it.','Fill up as soon as you reach a gas station.'],'If it starts but stalls, it may be the pump or the filter: go to the shop.'],['bid,tri',30,0,0]);
N('choque','auto','Emergencias',['Qué hacer en un choque','Seguro, fotos y datos','Qué pasó',{'Sin heridos':'Mueve los carros solo si es seguro y no hay riesgo.','Con heridos':'No muevas a los heridos; llama a emergencias de inmediato.'},'Si hay heridos, llama al 911 primero. No muevas a nadie lesionado.',['Respira, apaga el motor y pon las intermitentes.','Revisa si hay heridos y llama al 911 si los hay.','Si es seguro, saca los carros del paso y pon triángulos.','Toma fotos de los carros, las placas, el lugar y los daños.','Anota nombre, teléfono, placas y datos del seguro del otro conductor.','Llama a tu aseguradora y sigue sus instrucciones.','No admitas culpa en el lugar; deja que tu seguro lo resuelva.'],'Si hay discusión o daños graves, espera a la autoridad y a tu seguro.'],['What to do in a car crash','Insurance, photos and details','What happened',{'No injuries':'Move the cars only if it is safe and there is no risk.','Injuries':'Do not move injured people; call emergency services right away.'},'If anyone is hurt, call 911 first. Do not move anyone who is injured.',['Breathe, turn off the engine and turn on the hazard lights.','Check whether anyone is hurt and call 911 if so.','If it is safe, move the cars out of the way and put out warning triangles.','Take photos of the cars, the plates, the place and the damage.','Write down the other driver name, phone, plates and insurance details.','Call your insurer and follow its instructions.','Do not admit fault at the scene; let your insurer handle it.'],'If there is an argument or serious damage, wait for the authorities and your insurer.'],['cel,tri',60,1,0]);
N('estandar','auto','Manejo',['Manejar un carro estándar','Clutch, cambios y arrancar en subida','Tu carro',ST[0],'Practica en un lugar plano y vacío antes de salir a la calle.',['Con el motor apagado, pisa el clutch a fondo y mueve la palanca por los cambios para conocerlos.','Pisa el clutch a fondo, pon primera y arranca el motor.','Suelta el clutch muy despacio hasta sentir que el carro quiere avanzar.','Empieza a acelerar poquito y suelta el clutch por completo.','Para cambiar: suelta el acelerador, clutch a fondo, cambio y suelta suave.','Para frenar a baja velocidad, pisa clutch y freno juntos.','En subida: usa el freno de mano, suelta el clutch hasta sentirlo y luego el freno.'],'Practica varios días; si se apaga, no pasa nada: clutch, neutral y vuelve a arrancar.'],['Drive a manual car','Clutch, gears and starting uphill','Your car',ST[1],'Practice on flat, empty ground before going out on the street.',['With the engine off, press the clutch all the way and move the shifter through the gears to get to know them.','Press the clutch all the way, select first gear and start the engine.','Release the clutch very slowly until you feel the car wants to move.','Start giving a little gas and release the clutch fully.','To shift: lift off the gas, clutch all the way, change gear and release smoothly.','To brake at low speed, press clutch and brake together.','Uphill: use the handbrake, release the clutch until you feel it and then release the brake.'],'Practice for several days; if it stalls, it is fine: clutch, neutral and start again.'],['',60,1,0]);

var D2={2:['My washer is not working properly','washer washing machine wash drain spin clothes wet',[['It is unplugged or the breaker tripped','There is no power on the panel.','Try another device in that outlet and switch the breaker back on if it tripped.'],['The door does not close properly','Some will not start if the door does not click.','Remove any clothes in the way and close it until you hear the click.'],['The drain hose is bent','The hose is squashed behind the washer.','Straighten it and keep it at the height the manual says.'],['The pump filter is clogged','It keeps water at the end.','Clean the filter with a bucket underneath, as the guide explains.'],['The load is unbalanced','It stops while spinning and shakes a lot.','Spread the clothes evenly and do not overfill it.'],['The pump or the board is failing','It makes noise but does not move water, or the panel shows an error code.','Call a technician and tell them the code on the panel.']]],
4:['My car is overheating','car engine overheats temperature needle red steam coolant radiator',[['Coolant is low','The reservoir is below the MIN mark.','With the engine cold, top up with the mix in the manual.'],['The fan does not spin','You cannot hear the fan when the engine is hot.','Check its fuse; if it is fine, the fan motor is the problem: shop.'],['There is a leak','Green, pink or orange stains under the car.','Do not drive: follow the guide and call a tow truck.'],['The radiator is clogged on the outside','Leaves or mud on the front of the radiator.','With the engine cold, clean it on the outside with gentle water.'],['The thermostat is failing','It heats up fast even with coolant and no leaks.','The part is cheap, but replacing it is shop work.']]],
7:['My TV will not turn on','tv television screen turns on picture sound black remote',[['No power reaches it','There is no light at all on the TV.','Try another device in the outlet and check the power strip.'],['The remote has no batteries','The remote does not respond but the TV button does.','Change the batteries or use the button on the TV.'],['It is on another input','You see a blue or black screen with sound.','Press Source or Input and choose HDMI or antenna.'],['A cable is loose','The picture has lines or says no signal.','Tighten the HDMI and antenna cables.'],['The board or the screen is failing','The light is on and there is sound, but the screen stays black.','Take it to a TV technician.']]],
8:['My sink is clogged','sink clogged unclog drain slow water pipe trap',[['Debris plug in the drain','You can see standing water.','Use a plunger while blocking the overflow.'],['Built-up grease','It has been draining slowly for weeks.','Pour very hot water with soap, or baking soda and vinegar, and wait 15 minutes.'],['Grease or food in the trap','Water drains slowly and smells bad.','Put a bucket underneath, loosen the trap and clean it.'],['The main pipe is clogged','Several sinks or showers drain badly or gurgle.','Call a plumber.']]],
9:['Low water from the faucet or shower','water pressure low faucet shower tank pump limescale tap',[['The shower head has limescale','The holes are clogged with white dust.','Soak it in vinegar and water and scrub the holes.'],['The faucet aerator is dirty','Low flow only from that faucet.','Unscrew the screen at the tip and clean it.'],['The shut-off valve is half closed','It fails in the whole house.','Open it fully.'],['The tank or the pump is failing','Water does not rise or the pump is noisy.','Check that the tank has water; if it is full, call a plumber.'],['There is a leak','There are damp stains or the water bill came in very high.','Close the shut-off valve and call a plumber.']]],
10:['My tire keeps losing air','tire air low flat puncture',[['Pressure is low because of cold or time','It looks a bit squashed, but no noise.','Inflate it to the pressure on the driver door label.'],['It has a nail or screw','It goes down in a few days and something is stuck in it.','Do not pull it out: go to a tire shop to have it repaired.'],['The valve is leaking air','It goes down slowly; soapy water on the valve makes bubbles.','Tighten or replace the valve at a tire shop.'],['It is worn or damaged','You can see the cords, it has bulges or cracks.','Replace it: it is not safe to drive like that.']]],
11:['My toilet keeps running','toilet wc bathroom tank running water float',[['The float is too high','Water rises up to the overflow tube.','Lower the float arm a little.'],['The chain is too short or too long','It does not let the flapper close.','Adjust the chain so it has a little slack.'],['The rubber flapper does not seal','You hear water even when nobody uses it.','Clean it or replace it.'],['The fill mechanism is worn out','It keeps running and everything else is fine.','Replace it: the parts are cheap at a hardware store.']]],
12:['My microwave does not heat','microwave heat plate spin sparks turn on',[['The door does not close properly','It will not start unless the door clicks.','Clean the edge and the latch. If it is bent, call a technician.'],['The plate does not spin or is misplaced','It heats evenly only in one spot.','Check that the plate and the ring are seated properly.'],['The breaker tripped or the outlet fails','The panel does not light up.','Test the outlet with another device and switch the breaker on.'],['An internal part is failing','It turns on but does not heat, or makes loud noise or sparks.','Do not open it: it has high voltage even when unplugged. Call a technician or replace it.']]],
13:['My fan does not spin','fan spin blades wind motor turn on',[['No power reaches it','It does not spin and has no light.','Try another outlet or check the extension cord.'],['The blades are dirty or bent','It vibrates or spins slowly.','Unplug it and clean them with a damp cloth.'],['The speed selector is damaged','It only works at one speed.','Replace it or take it to a technician.'],['The motor burned out','It smells burnt and does not spin.','It is almost never worth repairing: replace it.']]],
14:['There is no hot water','hot water heater boiler shower lukewarm gas pilot',[['You smell gas','Strong gas smell near the heater.','Do not light it or use switches: ventilate, get out and call your gas provider.'],['The pilot is out','The heater does not light.','Follow the heater instructions to light the pilot.'],['The gas tank is empty or the valve is closed','Other gas appliances do not work either.','Check the tank and open the shut-off valve.'],['The thermostat is too low','The water comes out lukewarm.','Raise it a little, without overdoing it so you do not get burned.'],['There is limescale or a part is failing','It takes a long time to heat or makes noise.','Call a technician to clean or check it.']]],
15:['My car will not start','car will not start crank click battery',[['The battery is weak','The lights look dim or it clicks when you turn the key.','Jump-start it with another car and have the battery checked at a shop.'],['The terminals are dirty or loose','There is white or green powder on the terminals.','Clean and tighten them with the car off.'],['Out of gas','The gauge reads empty.','Fill up and try again.'],['The starter or alternator is failing','Everything above is fine and the engine does not turn, or the battery light stays on.','Call a tow truck or a mechanic.']]]};

N('llavegoteo','casa','Plomería',['La llave gotea','Cambia el empaque o el cartucho','Tipo de llave',{'De dos manerales':'Casi siempre es el empaque de goma o el asiento.','Monomando (una palanca)':'Normalmente se cambia el cartucho completo.'},'Cierra la llave de paso antes de desarmar nada y tapa el desagüe para que no caiga un tornillo.',['Cierra la llave de paso debajo del lavabo o la general.','Abre la llave para sacar el agua que quede.','Tapa el desagüe con un trapo.','Quita el tapón decorativo del maneral y suelta el tornillo con el desarmador.','Desenrosca la tuerca con la llave ajustable y saca el empaque o el cartucho.','Pon el repuesto igual al viejo, enrosca sin forzar y arma en orden contrario.','Abre la llave de paso despacio y revisa que ya no gotee.'],'Si el goteo viene de la pared o de la tubería, o el cuerpo de la llave está picado, llama a un plomero.'],['The faucet drips','Replace the washer or cartridge','Faucet type',{'Two handles':'It is almost always the rubber washer or the seat.','Single lever':'Usually the whole cartridge is replaced.'},'Close the shut-off valve before taking anything apart and cover the drain so no screw falls in.',['Close the shut-off valve under the sink or the main one.','Open the faucet to drain remaining water.','Cover the drain with a cloth.','Remove the decorative cap from the handle and take out the screw.','Unscrew the nut with the adjustable wrench and remove the washer or cartridge.','Fit a replacement identical to the old one, tighten gently and reassemble in reverse.','Open the shut-off valve slowly and check there is no drip.'],'If the leak comes from the wall or the pipe, or the faucet body is pitted, call a plumber.'],['llav,cint,trap,dest',30,1,0]);
N('puertarechina','casa','Reparaciones',['La puerta rechina o no cierra','Aprieta las bisagras y lubrica','Qué le pasa',{'Rechina':'Casi siempre es una bisagra seca.','Roza o no cierra':'Suele ser un tornillo flojo de una bisagra.'},'Sostén la puerta mientras aflojas tornillos: puede caerse.',['Abre la puerta y revisa cuál bisagra se mueve o rechina.','Aprieta todos los tornillos de las bisagras con el desarmador.','Si un tornillo gira en vacío, mete palillos con pegamento en el hoyo y deja secar.','Pon una gota de aceite en el pasador de cada bisagra.','Abre y cierra la puerta varias veces para repartir el aceite.','Limpia el exceso con un trapo.'],'Si la puerta está chueca o el marco está roto, llama a un carpintero.'],['The door squeaks or will not close','Tighten hinges and lubricate','What is wrong',{'Squeaks':'Almost always a dry hinge.','Rubs or will not close':'Usually a loose hinge screw.'},'Hold the door while loosening screws: it can fall.',['Open the door and check which hinge moves or squeaks.','Tighten all hinge screws with the screwdriver.','If a screw spins loose, put toothpicks with glue in the hole and let it dry.','Put a drop of oil on each hinge pin.','Open and close the door several times to spread the oil.','Wipe off the excess with a cloth.'],'If the door is crooked or the frame is cracked, call a carpenter.'],['dest,trap',20,0,0]);
N('sobrecalienta','auto','Motor',['El motor se calienta','Qué hacer sin dañar el motor','Qué ves',{'Aguja en rojo':'El motor ya está muy caliente: no sigas manejando.','Sale vapor del cofre':'Orillate y apaga ya; no abras el cofre de inmediato.'},'Nunca abras la tapa del anticongelante con el motor caliente: el líquido sale a presión y quema.',['Apaga el aire acondicionado y prende la calefacción al máximo para sacar calor.','Oríllate y apaga el motor en un lugar seguro.','Espera 30 minutos o más a que enfríe antes de abrir el cofre.','Abre el cofre y revisa el nivel del depósito de anticongelante.','Si está bajo, agrega anticongelante con agua solo cuando el motor esté frío.','Busca fugas o mangueras rotas.','Arranca y observa la aguja; si vuelve a subir, no sigas manejando.'],'Si vuelve a calentarse o ves vapor o fugas, llama a la grúa: seguir manejando puede fundir el motor.'],['The engine overheats','What to do without damaging the engine','What you see',{'Needle in red':'The engine is very hot: do not keep driving.','Steam from the hood':'Pull over and turn off now; do not open the hood right away.'},'Never open the coolant cap on a hot engine: the liquid sprays under pressure and burns.',['Turn off the AC and turn the heater to maximum to pull heat away.','Pull over and turn off the engine in a safe place.','Wait 30 minutes or more for it to cool before opening the hood.','Open the hood and check the coolant reservoir level.','If low, add coolant mixed with water only when the engine is cold.','Look for leaks or broken hoses.','Start it and watch the needle; if it rises again, do not keep driving.'],'If it overheats again or you see steam or leaks, call a tow truck: driving on can destroy the engine.'],['guan,trap,man',30,1,0]);
